name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest commit's run for each branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Run tests
        run: docker compose run --rm research
