services:
  research:
    build:
      context: .
    image: text-music-editing-alignment:dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: python -m unittest discover -s tests -v

  mlflow:
    build:
      context: .
    image: text-music-editing-alignment:mlflow
    # The service initializes named volumes owned by root; the research
    # container remains non-root for normal development and testing.
    user: "0:0"
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow-artifacts
      --allowed-hosts mlflow,localhost,127.0.0.1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/version')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mlflow-db:/mlflow
      - mlflow-artifacts:/mlflow-artifacts

volumes:
  mlflow-db:
  mlflow-artifacts:
